syntax = "proto3";

package poll.v1;

option go_package = "github.com/ReilEgor/Votivo-vote-service/pkg/grpc/pollv1;pollv1";

// PollService is implemented by Poll Service. Vote Service calls it to learn the rules of a poll
// before it accepts, changes or revokes a vote.
service PollService {
  // GetPoll returns the voting rules of a poll and the questions with their options.
  rpc GetPoll(GetPollRequest) returns (GetPollResponse);
}

message GetPollRequest {
  int64 id = 1;
}

message GetPollResponse {
  int64 id = 1;
  PollStatus status = 2;
  // anonymous hides the link between a user and the options they chose.
  bool anonymous = 3;
  // allow_vote_change lets a user change or revoke their vote while the poll is active.
  bool allow_vote_change = 4;
  repeated Question questions = 5;
}

message Question {
  int64 id = 1;
  // multiple allows choosing more than one option.
  bool multiple = 2;
  repeated int64 option_ids = 3;
}

enum PollStatus {
  POLL_STATUS_UNSPECIFIED = 0;
  POLL_STATUS_DRAFT = 1;
  POLL_STATUS_ACTIVE = 2;
  POLL_STATUS_CLOSED = 3;
  POLL_STATUS_ARCHIVED = 4;
  POLL_STATUS_BLOCKED = 5;
}
